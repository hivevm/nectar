[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/html",
    "crates/textmate",
    "crates/process",
    "crates/fetch",
    "crates/native",
    "crates/railroad",
    "crates/rough",
    "crates/pdf",
    "crates/server",
    "crates/cli",
    "crates/wasm-link",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/hivevm/doc"

# Dependencies such as Typst are slow unoptimised; optimise them in debug builds too, so
# `nectar serve` from the debugger stays quick. Nectar's own crates stay debuggable.
[profile.dev.package."*"]
opt-level = 2

# The WebAssembly step of scripts/check-build.sh only needs nectar-wasm-link to link, so nothing
# is optimised and no debug information is written: about a fifth of the CPU time of the dev
# profile, whose dependencies are optimised.
[profile.wasm-link]
inherits = "dev"
debug = false

[profile.wasm-link.package."*"]
opt-level = 0
debug = false
