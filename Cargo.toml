[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/html",
    "crates/textmate",
    "crates/process",
    "crates/fetch",
    "crates/native",
    "crates/railroad",
    "crates/pdf",
    "crates/server",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/hivevm/doc"

# Dependencies such as Typst are slow unoptimised; optimise them in debug builds too, so
# `nectar serve` from the debugger stays quick. Nectar's own crates stay debuggable.
[profile.dev.package."*"]
opt-level = 2
