[package]
name = "nectar"
description = "Nectar command line: build and serve"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
nectar-core = { version = "0.1.0", path = "../core" }
nectar-fetch = { version = "0.1.0", path = "../fetch" }
nectar-html = { version = "0.1.0", path = "../html" }
nectar-native = { version = "0.1.0", path = "../native" }
nectar-pdf = { version = "0.1.0", path = "../pdf" }
nectar-process = { version = "0.1.0", path = "../process" }
nectar-railroad = { version = "0.1.0", path = "../railroad" }
nectar-textmate = { version = "0.1.0", path = "../textmate" }
toml = "1.1.8"
nectar-server = { version = "0.1.0", path = "../server" }
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
