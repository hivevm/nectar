[package]
name = "nectar-html"
description = "Nectar HTML renderer and default theme"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
crc32fast = "1.5.4"
miniz_oxide = "0.9.1"
minijinja = { version = "3.0.3", features = ["serde"] }
nectar-core = { version = "0.1.0", path = "../core" }
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
