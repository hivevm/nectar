name: Nectar

on:
  push:
    branches: [main]
    paths: ["crates/**", "examples/**", "Cargo.toml", "Cargo.lock", ".github/workflows/nectar.yml"]
  pull_request:
    paths: ["crates/**", "examples/**", "Cargo.toml", "Cargo.lock", ".github/workflows/nectar.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # The demo uses Graphviz and PlantUML, which the runners lack; their blocks stay code and
      # are reported as warnings, so the build itself must succeed.
      - run: cargo run -p nectar -- -C examples/demo build
