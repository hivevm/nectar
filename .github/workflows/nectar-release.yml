name: Nectar release

# A tag such as nectar-v0.1.0 builds the CLI for every platform and attaches the archives to a
# GitHub release of that tag, with their SHA256SUMS and a build-provenance attestation for each
# archive (ADR-0019).
on:
  push:
    tags: ["nectar-v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux on Ubuntu 22.04, never *-latest: an archive needs the glibc it is built with,
          # 2.35 at most (ADR-0019).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup ships with the runner image; the toolchain is the latest stable, as in checks.yml.
      - name: Set up the Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      # scripts/release.sh builds and packs, as check-all.sh checks what it packs (ADR-0002).
      - name: Build and package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/release.sh package "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # the attestations' signing identity
      attestations: write # store the attestations
    steps:
      # The checkout first: it would clear the archives downloaded before it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # One attestation per archive, signed by this workflow; gh attestation verify
      # --signer-workflow hivevm/nectar/.github/workflows/nectar-release.yml checks it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/nectar-*"
      - name: Publish with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh publish dist
